apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "me.bgregos.brighttask"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 20
        versionName "1.6.1"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
    buildFeatures {
        viewBinding true
    }
    namespace 'me.bgregos.foreground'
    sourceSets.main.jniLibs.srcDir "$buildDir/generated/taskchampion/jniLibs"
}

def rustCrate = file('../rust/taskchampion-jni')
def rustOutput = file("$buildDir/generated/taskchampion/jniLibs/arm64-v8a")
def cargoTargetDir = System.getenv('CARGO_TARGET_DIR') ?: file("$buildDir/cargo-target").absolutePath
tasks.register('buildTaskChampionNative', Exec) {
    inputs.files(fileTree(rustCrate) { exclude 'target/**' })
    outputs.file(new File(rustOutput, 'libforeground_taskchampion_jni.so'))
    doFirst {
        rustOutput.mkdirs()
        def ndk = System.getenv('ANDROID_NDK_HOME') ?: System.getenv('ANDROID_NDK_ROOT') ?: '/opt/android-ndk-r30'
        def toolchain = "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
        environment 'CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER', "$toolchain/aarch64-linux-android21-clang"
        environment 'CC_aarch64_linux_android', "$toolchain/aarch64-linux-android21-clang"
        environment 'AR_aarch64_linux_android', "$toolchain/llvm-ar"
        environment 'CARGO_TARGET_DIR', cargoTargetDir
    }
    workingDir rustCrate
    commandLine 'sh', '-c', 'cargo build --locked --release --target aarch64-linux-android && cp "$CARGO_TARGET_DIR/aarch64-linux-android/release/libforeground_taskchampion_jni.so" ' + rustOutput
}
tasks.named('preBuild').configure { dependsOn 'buildTaskChampionNative' }

def room_version = "2.4.3"
def dagger_version = "2.30.1"
def debugSync = new Properties()
def debugSyncFile = rootProject.file('debug-sync.properties')
if (debugSyncFile.exists()) {
    debugSyncFile.withInputStream { debugSync.load(it) }
}
def asBuildConfigString = { String value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }

android.buildTypes.debug.buildConfigField 'String', 'TEST_SYNC_SERVER', asBuildConfigString(debugSync.getProperty('server', ''))
android.buildTypes.debug.buildConfigField 'String', 'TEST_SYNC_CLIENT_ID', asBuildConfigString(debugSync.getProperty('clientId', ''))
android.buildTypes.debug.buildConfigField 'String', 'TEST_SYNC_SECRET', asBuildConfigString(debugSync.getProperty('secret', ''))
android.buildTypes.release.buildConfigField 'String', 'TEST_SYNC_SERVER', '""'
android.buildTypes.release.buildConfigField 'String', 'TEST_SYNC_CLIENT_ID', '""'
android.buildTypes.release.buildConfigField 'String', 'TEST_SYNC_SECRET', '""'

dependencies {
    //implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.1'
    implementation 'androidx.work:work-runtime-ktx:2.7.1'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'com.google.code.gson:gson:2.10'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation "androidx.fragment:fragment-ktx:1.5.4"
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.4'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.0'

    //taskwarrior-java-client fork
    implementation project(':taskwarrior-java-client')

    //room db
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    testImplementation "androidx.room:room-testing:$room_version"

    //workmanager
    implementation 'androidx.work:work-runtime:2.7.1'

    //dagger2
    implementation "com.google.dagger:dagger:$dagger_version"
    kapt "com.google.dagger:dagger-compiler:$dagger_version"

}
