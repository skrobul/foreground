[package]
name = "foreground-taskchampion-jni"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
taskchampion = { version = "=3.1.0", default-features = false, features = [
    "storage-sqlite",
    "bundled",
    "server-sync",
    "tls-webpki-roots",
] }
jni = { version = "=0.22.4", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
lazy_static = "1"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = "debuginfo"